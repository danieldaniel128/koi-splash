# Every pull request runs the checks, so it shows a pass/fail before merging, and develop runs them again after each
# merge. A branch with a pull request isn't also checked on push, so each change is checked once.
name: Checks

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main]

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
