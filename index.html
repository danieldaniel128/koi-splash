<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Koi Splash</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="game" inert></div>
    <div id="loading" class="loading">
      <div class="loading__moon" aria-hidden="true"></div>
      <h1 class="number loading__title">Koi Splash</h1>
      <p class="label loading__tagline">A koi pond by moonlight</p>
      <div
        class="track loading__bar"
        role="progressbar"
        aria-label="Loading the pond"
        aria-valuemin="0"
        aria-valuemax="100"
        aria-valuenow="0"
      >
        <span class="loading__fill"></span>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
